<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Desktop Profile Switcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="app" aria-busy="true">
    <header class="app-header">
      <strong class="brand">Mobile Desktop Profile Switcher</strong>
      <label class="global-switch" for="global-toggle">
        <span id="global-state">Loading…</span>
        <input id="global-toggle" type="checkbox" role="switch" aria-label="Global enabled" disabled>
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
      </label>
    </header>

    <p id="status" class="status" role="status" aria-live="polite">Loading…</p>
    <p id="error" class="error" role="alert" hidden></p>

    <section id="current-view" class="view" hidden>
      <h1>Current site</h1>
      <div id="current-content" class="panel"></div>
      <section id="other-sites" class="registered-sites">
        <h2 id="other-sites-summary"></h2>
        <ul id="site-list" class="site-list"></ul>
      </section>
    </section>

    <section id="form-view" class="view" hidden>
      <h1 id="form-title">Add site</h1>
      <form id="site-form" class="panel" novalidate>
        <label for="site-name">Name</label>
        <input id="site-name" name="name" autocomplete="off" maxlength="80">

        <fieldset>
          <legend>Hosts</legend>
          <div id="host-list" class="host-list"></div>
          <button id="add-host" type="button" class="tertiary-action">+ Add host</button>
        </fieldset>

        <label for="form-profile">Profile</label>
        <select id="form-profile" name="profile">
          <option value="default">Default</option>
          <option value="desktop">Desktop</option>
          <option value="mobile">Mobile</option>
        </select>

        <div class="form-footer sticky-actions">
          <div class="form-actions">
            <button id="cancel-form" type="button" class="secondary">Cancel</button>
            <button id="save-site" type="submit">Save</button>
          </div>
        </div>
      </form>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
